##⇘⇘在(shift+)i键的第一页查看vf/af的启用列表，第二页是glsl/hook的加载列表，第四页是静态键位绑定列表
##任何着色器和滤镜都可以设置成自动加载模式而无需每次手动装载，详见 mpv.conf 中“脚本 滤镜 着色器”的部分
##自定义快捷键的规则见手册 [05]

